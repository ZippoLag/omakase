name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node 20/22 only: better-sqlite3@11 ships a native binding whose ABI is
      # unsupported on Node 24+ (it crashes on GC). CI reads the pinned .nvmrc
      # (22) so the native build always targets a supported Node; keep that file
      # and this workflow in sync (see package.json engines ">=20 <24").
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # pnpm version is pinned via the packageManager field in package.json;
      # corepack installs exactly that version.
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Golden tests
        run: pnpm test

      # Goldens are generated by tests/fixtures/scripts/render-goldens.py, the
      # Python reference renderer. Regenerating must be a no-op: a diff means
      # the committed goldens drifted from the reference — which, combined
      # with `pnpm test` (TS output vs goldens), means reference renderer and
      # TypeScript formatters would silently disagree.
      - name: Golden regeneration check (reference renderer must match committed goldens)
        run: |
          python3 tests/fixtures/scripts/render-goldens.py
          status=$(git status --porcelain -- tests/fixtures/golden)
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::goldens drifted from tests/fixtures/scripts/render-goldens.py — run it locally and commit the regenerated files"
            exit 1
          fi

      - name: Conjugation validation (3,511-table diff + [G] gap fixtures)
        run: pnpm run validate:conjugations